server {
	listen 5173;
	server_name _;
	root /usr/share/nginx/html;

	# Edital PDFs can be a few MB; keep in step with the backend's 20 MiB limit.
	client_max_body_size 25m;

	# Docker's embedded DNS, so `backend` is re-resolved instead of cached for
	# nginx's whole process lifetime. A bare `proxy_pass http://backend:8080`
	# resolves once at worker startup — when a deploy recreates the backend
	# container with a new IP (which docker compose does whenever that
	# service's image changes) but leaves this container alone, nginx keeps
	# sending every request to the now-dead old IP and the site 502s until
	# something restarts this container by hand. Putting the host in a
	# variable forces resolution on the DNS record's TTL instead.
	resolver 127.0.0.11 valid=10s;

	# Static SPA assets; fall back to index.html for client-side routes.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# API goes to the Go backend on the compose network.
	location /api/ {
		set $backend_upstream http://backend:8080;
		proxy_pass $backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;

		# The edital import waits on an external LLM call (can take a minute+).
		proxy_connect_timeout 10s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}

	location = /health {
		set $backend_upstream http://backend:8080;
		proxy_pass $backend_upstream/health;
	}
}
