server {
	listen 5173;
	server_name _;
	root /usr/share/nginx/html;

	# Edital PDFs can be a few MB; keep in step with the backend's 20 MiB limit.
	client_max_body_size 25m;

	# Static SPA assets; fall back to index.html for client-side routes.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# API goes to the Go backend on the compose network.
	location /api/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;

		# The edital import waits on an external LLM call (can take a minute+).
		proxy_connect_timeout 10s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}

	location = /health {
		proxy_pass http://backend:8080/health;
	}
}
