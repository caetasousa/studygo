# A esteira inteira vem do template central, fixado por tag: uma mudança lá só
# alcança este projeto quando o ref abaixo subir deliberadamente.
#
# Estágios, garantias e variáveis exigidas: veja o README do ci-templates.

include:
  - project: 'caetasousa/ci-templates'
    ref: 'v1.1.8'
    file: '/templates/app-pipeline.yml'

# Voltar uma versão é o botão do próprio GitLab: Operate > Environments >
# production > "Rollback environment" na versão desejada. Ele reexecuta o
# deploy_production daquela pipeline, com os digests dela, sem reconstruir
# nada (docs/ci-cd.md).
#
# O rollback_production do template fica desligado aqui. Ele pede três digests
# colados à mão e não passa --vault-password-file ao playbook — sem ela os
# secrets.yml não são decifrados e o deploy falha. Um botão chamado rollback ao
# lado do de produção, que não funciona na hora da pressa, é pior que nenhum.
# Quando o template o corrigir ou remover, este bloco sai junto com o ref.
rollback_production:
  rules:
    - when: never

# --- E2E ---------------------------------------------------------------------
# O app inteiro pelo navegador, contra as imagens que o build acabou de fazer:
# a mesma suíte do `make e2e`, num stack descartável dentro do docker do job
# (e2e/ci.sh). Roda ao lado do artifact_test, e o relatório — com o print de
# cada cenário — fica como artefato do job, passe ou falhe.
e2e:
  tags: [local-build]
  stage: artifact_test
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=172.16.0.0/12"]
  needs: [build:backend, build:frontend]
  before_script:
    - apk add --no-cache bash curl
    # O registry do host, como no template (âncora .registry_local do
    # ci-templates). Âncora YAML não atravessa o include, então vai repetida.
    - |
      export LOCAL_REGISTRY="$(ip route | awk '/^default/ {print $3; exit}'):5000"
      for i in $(seq 1 15); do
        wget -qO- "http://$LOCAL_REGISTRY/v2/" >/dev/null 2>&1 && break
        echo "aguardando o registry local ($i)..."
        sleep 2
      done
      wget -qO- "http://$LOCAL_REGISTRY/v2/" >/dev/null 2>&1 || {
        echo "FALHA - o registry local nao respondeu em $LOCAL_REGISTRY."
        echo "No host do runner: docker start registry-local"
        exit 1
      }
  script:
    - ./e2e/ci.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - e2e/relatorio/

# O publish do template espera o artifact_test e os builds; o e2e entra na
# lista para que uma imagem que quebra um fluxo do usuário não chegue ao
# Registry. A lista inteira é repetida porque o GitLab substitui arrays em vez
# de somar — ao subir o ref do template, confira se o needs dele mudou.
publish:
  needs: [artifact_test, e2e, build:backend, build:frontend, build:processor]

