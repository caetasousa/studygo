# A esteira inteira vem do template central, fixado por tag: uma mudança lá só
# alcança este projeto quando o ref abaixo subir deliberadamente.
#
# Estágios, garantias e variáveis exigidas: veja o README do ci-templates. O
# que este arquivo muda no template está em docs/ci-cd.md ("O que o projeto
# muda no template"). Os jobs redefinidos aqui se fundem aos do template: as
# chaves escritas aqui ganham, e uma lista (needs, rules, script) substitui a
# do template inteira, não soma.

include:
  - project: 'caetasousa/ci-templates'
    ref: 'v1.1.8'
    file: '/templates/app-pipeline.yml'

variables:
  # A imagem do job de deploy (ci/deploy.Dockerfile). Mudou o Dockerfile?
  # Suba a tag: o job imagem:deploy só constrói a que ainda não existe.
  DEPLOY_IMAGE_TAG: "ansible-2.21.5-1"

# Não há produção: o único ambiente é o servidor próprio (a distro
# ubuntu-server do WSL), alimentado pelo push na main. Os jobs de produção do
# template — que só rodariam numa tag — ficam desligados, para uma tag criada
# por engano não mandar nada a lugar nenhum.
deploy_production:
  rules:
    - when: never

verify:
  rules:
    - when: never

rollback_production:
  rules:
    - when: never

# O registry do host, como no template (.registry_local do ci-templates).
# Âncora YAML não atravessa o include, então vai repetida aqui.
.registry_local_projeto: &registry_local |
  export LOCAL_REGISTRY="$(ip route | awk '/^default/ {print $3; exit}'):5000"
  for i in $(seq 1 15); do
    wget -qO- "http://$LOCAL_REGISTRY/v2/" >/dev/null 2>&1 && break
    echo "aguardando o registry local ($i)..."
    sleep 2
  done
  wget -qO- "http://$LOCAL_REGISTRY/v2/" >/dev/null 2>&1 || {
    echo "FALHA - o registry local nao respondeu em $LOCAL_REGISTRY."
    echo "No host do runner: docker start registry-local"
    exit 1
  }

# --- validate ----------------------------------------------------------------
# Só o syntax-check, e só quando o Ansible ou a esteira mudam. O ansible-lint
# do template rodava a cada push com o resultado ignorado (`|| true`) e era o
# job mais lento do caminho: 1 min 40 s para nada barrar.
validate:ansible:
  before_script:
    - pip install --quiet ansible-core
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - cd ansible
    - cp inventory/staging/hosts.ini.example inventory/staging/hosts.ini
    - ansible-playbook --syntax-check deploy.yml -i inventory/staging/hosts.ini
  rules:
    - changes: [ansible/**/*, .gitlab-ci.yml, ci/deploy.Dockerfile]

# --- caches dos testes ---------------------------------------------------------
# O runner guarda o cache em volume local: os módulos do Go e os pacotes do npm
# e do uv deixam de ser baixados a cada job. Do npm se guarda o diretório de
# pacotes baixados, não o node_modules: o `npm ci` apaga o node_modules antes
# de instalar, então guardá-lo não servia de nada.
.cache_go: &cache_go
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  cache:
    key:
      files: [backend/go.sum]
      prefix: go
    paths: [.cache/go-mod, .cache/go-build]

.cache_npm: &cache_npm
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: npm
    paths: [.cache/npm]

.cache_uv: &cache_uv
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key:
      files: [edital-processor/uv.lock]
      prefix: uv
    paths: [.cache/uv]

lint:backend:
  <<: *cache_go

test:backend:
  <<: *cache_go

# Lê o cache sem regravá-lo: o lint e o test:backend já gravam a mesma chave.
test:backend:integration:
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  cache:
    key:
      files: [backend/go.sum]
      prefix: go
    paths: [.cache/go-mod, .cache/go-build]
    policy: pull

lint:frontend:
  <<: *cache_npm
  script:
    - cd frontend
    - npm ci --cache ../.cache/npm --prefer-offline --no-audit --no-fund
    - npm run check

test:frontend:
  <<: *cache_npm
  script:
    - cd frontend
    - npm ci --cache ../.cache/npm --prefer-offline --no-audit --no-fund
    - npm test

lint:processor:
  <<: *cache_uv

test:processor:
  <<: *cache_uv

# --- build ---------------------------------------------------------------------
# O build não espera os testes: começa junto com eles. A garantia continua — o
# publish (abaixo) só empurra para o Registry depois de todos os testes, do
# artifact_test e do e2e passarem.
#
# Cache de camadas: o BuildKit guarda as camadas no registry-local
# (cache/<componente>:buildcache) e as busca de lá no build seguinte. O docker
# do job nasce vazio, então sem isto toda camada era refeita — a do
# processador (apt, tesseract, Claude Code) levava 3 min 30 s a cada push.
# Reaproveitada, a camada sai com o mesmo digest: o publish não a reenvia ao
# GitLab e o servidor não a baixa de novo. O image-manifest=true grava o cache
# como uma imagem comum, que o garbage-collect do registry sabe percorrer
# (make registry-limpar).
.build_com_cache: &build_com_cache
  needs: []
  script:
    - |
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      cat > /tmp/buildkitd.toml <<EOF
      [registry."$LOCAL_REGISTRY"]
        http = true
        insecure = true
      EOF
      # O dind fala TLS, e o buildx só aceita os certificados por um contexto.
      # network=host: o BuildKit usa a rede do dind, de onde o registry do host
      # responde no gateway — o mesmo caminho do docker push do template.
      docker context create dind >/dev/null
      docker buildx create --name ci --driver docker-container \
        --driver-opt network=host --driver-opt image=moby/buildkit:v0.22.0 \
        --config /tmp/buildkitd.toml --use dind
      docker buildx build \
        --cache-from "type=registry,ref=$LOCAL_REGISTRY/cache/$COMPONENT:buildcache" \
        --cache-to "type=registry,ref=$LOCAL_REGISTRY/cache/$COMPONENT:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
        --provenance=false \
        -t "$LOCAL_REGISTRY/$COMPONENT:$IMAGE_TAG" --push "$CONTEXT"

build:backend:
  <<: *build_com_cache

build:frontend:
  <<: *build_com_cache

build:processor:
  <<: *build_com_cache

# A imagem do job de deploy, guardada no registry-local. Só é construída
# quando a tag DEPLOY_IMAGE_TAG ainda não existe lá.
imagem:deploy:
  tags: [local-build]
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=172.16.0.0/12"]
  needs: []
  before_script:
    - *registry_local
  script:
    - |
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      alvo="$LOCAL_REGISTRY/ci/deploy-ansible:$DEPLOY_IMAGE_TAG"
      if docker pull -q "$alvo" >/dev/null 2>&1; then
        echo "a imagem de deploy $DEPLOY_IMAGE_TAG já existe; nada a construir"
        exit 0
      fi
      docker build -t "$alvo" -f ci/deploy.Dockerfile ci
      docker push "$alvo"

# --- e2e -----------------------------------------------------------------------
# O app inteiro pelo navegador, contra as imagens que o build acabou de fazer:
# a mesma suíte do `make e2e`, num stack descartável dentro do docker do job
# (e2e/ci.sh). Roda ao lado do artifact_test, e o relatório — com o print de
# cada cenário — fica como artefato do job, passe ou falhe.
e2e:
  tags: [local-build]
  stage: artifact_test
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=172.16.0.0/12"]
  needs: [build:backend, build:frontend]
  before_script:
    - apk add --no-cache bash curl
    - *registry_local
  script:
    - ./e2e/ci.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - e2e/relatorio/

# --- publish -------------------------------------------------------------------
# Só entra no Registry o que passou em tudo: os testes (que agora correm ao
# lado do build), o artifact_test e o e2e. A lista inteira é repetida porque
# o GitLab substitui arrays em vez de somar — ao subir o ref do template,
# confira se o needs dele mudou.
publish:
  needs:
    - validate:ci
    - job: validate:ansible
      optional: true
    - lint:backend
    - lint:frontend
    - lint:processor
    - test:backend
    - test:backend:integration
    - test:frontend
    - test:processor
    - build:backend
    - build:frontend
    - build:processor
    - artifact_test
    - e2e
  # A pipeline agendada (segurança, abaixo) testa tudo mas não publica.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# --- deploy --------------------------------------------------------------------
# O mesmo before_script do template, numa imagem que já traz o SSH e o Ansible
# (ci/deploy.Dockerfile): o apt e o pip dele só conferem que está instalado. O
# runner de deploy puxa a imagem pelo Docker da distro de desenvolvimento, onde
# o registry-local responde em localhost:5000.
deploy_staging:
  image: "localhost:5000/ci/deploy-ansible:$DEPLOY_IMAGE_TAG"
  needs: [publish, imagem:deploy]
  environment:
    name: staging
    url: https://studygo.d4ffy.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# O smoke_test do template chama um domínio que não existe mais. Este confere
# duas coisas que o /health sozinho não garantia: que a versão no ar é a deste
# commit (um deploy que deixasse o container antigo de pé passava) e que o
# app responde também pelo endereço público, pelo túnel. O endereço interno é
# o nginx do servidor pela bridge do Docker, o mesmo caminho do SSH do deploy.
smoke_test:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      esperado="$CI_COMMIT_SHORT_SHA"
      for url in "http://172.17.0.1:8480/health" "https://studygo.d4ffy.com/health"; do
        ok=0; corpo=""
        for i in $(seq 1 10); do
          corpo="$(curl -fsS -m 10 "$url" 2>/dev/null || true)"
          case "$corpo" in *"\"versao\":\"$esperado\""*) ok=1; break ;; esac
          sleep 3
        done
        if [ "$ok" != 1 ]; then
          echo "FALHA - $url não está na versão $esperado. Resposta: ${corpo:-nenhuma}"
          exit 1
        fi
        echo "OK - $url responde na versão $esperado"
      done

# --- segurança (semanal) -------------------------------------------------------
# Vulnerabilidades conhecidas nas dependências dos três serviços (o mesmo
# `make seguranca`). Rodam só na pipeline agendada (Build → Pipeline schedules,
# toda semana na main), que testa tudo mas não publica nem implanta: o banco de
# vulnerabilidades muda sozinho, e um push não pode ficar vermelho por isso.
# Avisam sem bloquear.
.seguranca: &seguranca
  tags: [local-build]
  stage: unit_test
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

seguranca:backend:
  <<: *seguranca
  image: golang:1.27-alpine
  script:
    - cd backend
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

seguranca:frontend:
  <<: *seguranca
  image: node:24-alpine
  script:
    - cd frontend
    - npm audit --omit=dev

seguranca:processor:
  <<: *seguranca
  image: python:3.13-slim
  before_script:
    - pip install --quiet uv
  script:
    - cd edital-processor
    - uv run --with pip-audit pip-audit
