---
- name: Provision studygo VPS
  hosts: app
  become: true
  gather_facts: true

  # Cada role carrega sua tag: este playbook mexe numa VPS que roda produção,
  # e `common` faz upgrade de pacotes. Poder rodar só `--tags certbot` evita
  # que emitir um certificado arraste um upgrade do sistema junto.
  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: nginx
      tags: [nginx]
    - role: certbot
      tags: [certbot]

  post_tasks:
    - name: Verify nginx/TLS is responding
      uri:
        url: "https://{{ app_domain }}/health"
        status_code: 200
      retries: 3
      delay: 5
      tags: [verify]
