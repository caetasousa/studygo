---
# Provisiona o servidor: tudo o que a aplicação precisa para rodar, menos a
# aplicação — quem publica é a pipeline (deploy.yml).
#
# O servidor é uma distro do WSL (ubuntu-server) preparada antes pelo
# bootstrap-wsl.sh. As distros do WSL2 dividem a mesma rede, e isso explica os
# papéis: Docker rootless do usuário do projeto (um Docker comum brigaria com
# o da distro de desenvolvimento), sem firewall local (fecharia a rede das
# duas) e a borda pelo cloudflared, sem porta aberta para fora.
#
# Cada papel tem sua tag: `--tags cloudflared` refaz só o túnel.
- name: Provisionar o servidor do studygo
  hosts: app
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common]
    - role: docker_rootless
      tags: [docker]
    - role: nginx
      tags: [nginx]
    - role: cloudflared
      tags: [cloudflared]
