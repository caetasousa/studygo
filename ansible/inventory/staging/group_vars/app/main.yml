---
# O ambiente da esteira (push na main) — o único. Roda num servidor dentro do
# WSL da máquina de desenvolvimento — a distro `ubuntu-server` —, publicado
# por um túnel da Cloudflare.
#
# O servidor só fica no ar com o PC ligado e a distro de pé.
# Os domínios de caetasousa.tech se foram em 25/09/2026. Hoje o nome só
# alimenta o CORS_ORIGIN (a SPA é servida do mesmo endereço que a API, então
# não faz diferença) — o endereço público é o do Quick Tunnel, abaixo, e o
# nginx aceita qualquer nome. Troque aqui quando houver domínio próprio.
app_domain: staging.cronograma.caetasousa.tech
app_domain_www: cronograma.caetasousa.tech
app_dir: /opt/studygo-staging
backend_port: 18080
frontend_port: 15173

postgres_user: studygo_staging
postgres_db: studygo_staging

vhost_file: studygo-staging.conf

# --- servidor -------------------------------------------------------------------
# As distros do WSL2 dividem a mesma rede: daí o Docker rootless do usuário do
# projeto, sem firewall local, e a borda pelo cloudflared (ver site.yml e
# docs/cloudflare-tunnel.md).
#
# Um usuário por projeto no servidor: com o Docker rootless, cada usuário tem
# o próprio daemon, os próprios volumes e as próprias imagens — outro projeto
# neste mesmo servidor não enxerga nem derruba este.
deploy_user: studygo
# Nome dos recursos do servidor que são por projeto (o serviço do endereço
# temporário, por exemplo).
projeto: studygo
# A porta do nginx. O túnel aponta para localhost:8480 (painel da Cloudflare:
# Route → HTTP → localhost:8480); o smoke_test da esteira, num container do
# runner, chega por 172.17.0.1:8480. Escutar em todas as interfaces não expõe
# nada fora do PC: o WSL em modo NAT não publica porta na rede local.
nginx_porta: 8480
# Sem domínio próprio (os de caetasousa.tech se foram em 25/09/2026): o endereço
# público é um *.trycloudflare.com que muda a cada reinício do serviço — veja
# com `make servidor-endereco`. Com um domínio na Cloudflare, aponte-o para o
# túnel do token (cloudflared_token) e desligue isto.
cloudflared_rapido: true
