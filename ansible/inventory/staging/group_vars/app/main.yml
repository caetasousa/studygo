---
# O ambiente da esteira (push na main) — o único. Roda num servidor dentro do
# WSL da máquina de desenvolvimento — a distro `ubuntu-server` —, publicado
# por um túnel da Cloudflare.
#
# O servidor só fica no ar com o PC ligado e a distro de pé.
# O endereço público: a rota do túnel com token na Cloudflare aponta
# studygo.d4ffy.com para o nginx (docs/cloudflare-tunnel.md). O nome também
# alimenta o CORS_ORIGIN; o nginx aceita qualquer nome.
app_domain: studygo.d4ffy.com
app_dir: /opt/studygo-staging
backend_port: 18080
frontend_port: 15173

postgres_user: studygo_staging
postgres_db: studygo_staging

vhost_file: studygo-staging.conf

# --- servidor -------------------------------------------------------------------
# As distros do WSL2 dividem a mesma rede: daí o Docker rootless do usuário do
# projeto, sem firewall local, e a borda pelo cloudflared (ver site.yml e
# docs/cloudflare-tunnel.md).
#
# Um usuário por projeto no servidor: com o Docker rootless, cada usuário tem
# o próprio daemon, os próprios volumes e as próprias imagens — outro projeto
# neste mesmo servidor não enxerga nem derruba este.
deploy_user: studygo
# Nome dos recursos do servidor que são por projeto (o serviço do endereço
# temporário, por exemplo).
projeto: studygo
# A porta do nginx. O túnel aponta para localhost:8480 (painel da Cloudflare:
# Route → HTTP → localhost:8480); o smoke_test da esteira, num container do
# runner, chega por 172.17.0.1:8480. Escutar em todas as interfaces não expõe
# nada fora do PC: o WSL em modo NAT não publica porta na rede local.
nginx_porta: 8480

# Recursos: o servidor divide a VM do WSL (6 GB, .wslconfig do Windows) com a
# distro de desenvolvimento. Tetos com folga sobre o uso medido em 26/09/2026
# (parado: backend 11 MB, worker 3 MB, frontend 11 MB, postgres 33 MB,
# processador 132 MB); o processador sobe mais ao capturar a Constituição, e
# mais ainda com o Claude Code fazendo um mapa (Node, ~500 MB). O backend
# segura o PDF da aula (até 40 MB) enquanto o entrega ao processador.
mem_limit_frontend: 64m
mem_limit_backend: 256m
go_mem_limit_backend: 200MiB
mem_limit_worker: 96m
go_mem_limit_worker: 64MiB
mem_limit_postgres: 256m
mem_limit_processor: 1536m
# backend e worker abrem até 10 conexões cada (platform/db).
postgres_args:
  - shared_buffers=32MB
  - max_connections=30
  - work_mem=2MB
  - maintenance_work_mem=32MB
  - effective_cache_size=128MB
# Com domínio próprio (d4ffy.com, na Cloudflare), o túnel com token
# (cloudflared_token) leva o endereço fixo, e o Quick Tunnel
# (*.trycloudflare.com, que mudava a cada reinício) fica desligado. Ligar isto
# de volta é o plano B sem domínio.
cloudflared_rapido: false
