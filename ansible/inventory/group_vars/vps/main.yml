---
app_domain: cronograma.caetasousa.tech
# No separate www DNS record for this subdomain, so the vhost and certificate
# just cover the one name twice rather than requiring www.cronograma... to
# resolve too.
app_domain_www: cronograma.caetasousa.tech
backend_port: 8080
frontend_port: 5173
# Still `annygo`, from the project's old name: this is the live database on the
# VPS. Changing it here would point the app at a new, empty database and leave
# the real one untouched. Renaming needs an explicit migration (ALTER DATABASE /
# ALTER ROLE) in the same maintenance window.
postgres_user: annygo
postgres_db: annygo
