---
# Produção. Estes valores apontam para os dados REAIS na VPS.
app_domain: cronograma.caetasousa.tech
app_domain_www: cronograma.caetasousa.tech
app_dir: /opt/annygo
backend_port: 8080
frontend_port: 5173

# Ainda `annygo`, do nome antigo do projeto: este é o banco vivo. Trocar aqui
# apontaria a aplicação para um banco novo e vazio, deixando o real intocado.
postgres_user: annygo
postgres_db: annygo

# Continua annygo.conf: é o vhost já habilitado na VPS. Mudar o nome deixaria
# os dois em sites-enabled ao mesmo tempo, e o nginx serviria o que lesse
# primeiro.
vhost_file: annygo.conf

# Certificado usado pelo vhost de recusa. É sempre o de produção: esse vhost é
# único no servidor e precisa de um certificado que exista de fato.
default_cert_domain: cronograma.caetasousa.tech
