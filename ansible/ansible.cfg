[defaults]
retry_files_enabled = False
# Sem inventory padrão: cada execução escolhe staging ou production
# explicitamente. Um deploy que erra o ambiente por omissão é caro demais.

# Ligado de propósito. Com isto desligado, um man-in-the-middle no caminho do
# runner receberia a chave de deploy sem que nada acusasse. O known_hosts é
# provisionado no job (variável SSH_KNOWN_HOSTS) e no bootstrap local.
host_key_checking = True

# Os secrets.yml são cifrados com Ansible Vault. Sem isto, todo playbook falha
# com "Attempting to decrypt but no vault secrets found".
#
# O arquivo é local (modo 600) e está no .gitignore — nunca vai para o
# repositório. No CI, o job cria este mesmo arquivo a partir da variável
# protegida ANSIBLE_VAULT_PASSWORD.
vault_password_file = .vault_pass

[ssh_connection]
pipelining = True
