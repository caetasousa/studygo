---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Check for existing Let's Encrypt certificate
  stat:
    path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
  register: nginx_cert_check

# Recusa qualquer Host sem vhost próprio. Sem isto o nginx entrega o primeiro
# vhost que encontra, e um subdomínio novo apontado para o IP cai na aplicação
# real — foi o que aconteceu com staging.cronograma antes de ser provisionado.
- name: Deploy default vhost that refuses unknown hosts
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/default-deny.conf.j2"
    dest: /etc/nginx/sites-available/000-default-deny.conf
    mode: '0644'
  vars:
    letsencrypt_cert_exists: "{{ nginx_cert_check.stat.exists }}"
  notify: reload nginx

- name: Enable default deny vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/000-default-deny.conf
    dest: /etc/nginx/sites-enabled/000-default-deny.conf
    state: link
  notify: reload nginx

# Um arquivo por ambiente. Com nome fixo, provisionar staging sobrescreveria o
# vhost de produção — os dois ambientes dividem este nginx.
# Produção continua em annygo.conf, do nome antigo do projeto: renomear deixaria
# os dois habilitados ao mesmo tempo, servindo o que o nginx lesse primeiro.
- name: Deploy studygo vhost
  template:
    src: "{{ playbook_dir }}/templates/app.conf.j2"
    dest: /etc/nginx/sites-available/{{ vhost_file }}
    mode: '0644'
  vars:
    letsencrypt_cert_exists: "{{ nginx_cert_check.stat.exists }}"
  notify: reload nginx

- name: Enable studygo vhost
  file:
    src: /etc/nginx/sites-available/{{ vhost_file }}
    dest: /etc/nginx/sites-enabled/{{ vhost_file }}
    state: link
  notify: reload nginx

- name: Ensure nginx is enabled and running
  systemd:
    name: nginx
    enabled: true
    state: started
