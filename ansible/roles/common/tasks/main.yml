---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: safe

- name: Install base packages
  apt:
    name:
      - curl
      - git
      # O servidor passa semanas sem ninguém olhando: correção de segurança do
      # sistema entra sozinha.
      - unattended-upgrades
    state: present

- name: Apply security updates automatically
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Sem firewall local, de propósito: a rede do WSL2 é a mesma para todas as
# distros, e um ufw com "deny by default" aqui fecharia a distro de
# desenvolvimento e o runner da esteira. Nada precisa entrar de fora — o
# cloudflared só faz conexões de saída.

# O servidor é uma distro do WSL que divide a memória da VM com a distro de
# desenvolvimento: o que ele não usa não pode ficar de pé. Mascarado, e não só
# desligado, para um upgrade do pacote não religar.
- name: Descobrir os serviços instalados
  ansible.builtin.service_facts:

- name: Desligar serviços que um servidor no WSL não usa
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    # A rede é do WSL, não do networkd.
    - networkd-dispatcher.service
    # O journal já guarda os logs; o nginx grava os dele.
    - rsyslog.service
    # Agente do Ubuntu Pro para WSL e o snap: nada aqui é instalado por eles.
    - wsl-pro.service
    - snapd.service
    - snapd.socket
    - snapd.seeded.service
    # Interface de pacotes do desktop, acordada pelo apt; o Ansible usa o apt direto.
    - packagekit.service
    # Parado, ele desfaz TODOS os binfmt do kernel — e o kernel é o mesmo da
    # distro de desenvolvimento, que perde a ponte com o Windows (schtasks.exe,
    # wsl.exe: "Exec format error"). O servidor não registra binfmt nenhum.
    # Encerrar a distro ainda desfaz a ponte: por isso o make
    # servidor-desligar para os serviços e deixa a distro ociosa.
    - systemd-binfmt.service
    # Só o ajudante de desligamento: as atualizações de segurança continuam,
    # pelo timer apt-daily-upgrade.
    - unattended-upgrades.service
  when: item in ansible_facts.services or item.endswith('.socket')
  failed_when: false

- name: Desligar timers de manutenção de desktop
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - man-db.timer
    - motd-news.timer
    - e2scrub_all.timer
    - dpkg-db-backup.timer
  failed_when: false

- name: Pasta de ajustes do journal
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Teto para o journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-servidor-wsl.conf
    mode: '0644'
    content: |
      [Journal]
      SystemMaxUse=64M
      RuntimeMaxUse=16M
  register: journald

- name: Aplicar o teto do journal
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  when: journald.changed

