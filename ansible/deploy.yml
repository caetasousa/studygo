---
# Promove um artefato já construído e testado pela pipeline. Este playbook NÃO
# compila nada: recebe digests imutáveis, faz pull deles do Registry e sobe a
# stack. Se ele pudesse construir, o que roda em produção deixaria de ser
# necessariamente o que passou nos testes.
#
# Uso (a pipeline preenche isto; veja templates/app-pipeline.yml):
#   ansible-playbook deploy.yml -i inventory/production/hosts.ini \
#     -e "backend_image=registry.gitlab.com/.../backend@sha256:..." \
#     -e ...
- name: Deploy studygo (backend + worker + frontend)
  hosts: app
  become: true
  gather_facts: false

  vars:
    # Diretório da stack em execução na VPS. Ainda /opt/annygo em produção, do
    # nome antigo do projeto: mudar aqui implantaria num diretório novo e vazio,
    # deixando a stack antiga rodando com os dados.
    remote_app_dir: "{{ app_dir | default('/opt/annygo') }}"
    previous_state_file: "{{ remote_app_dir }}/.deploy-anterior"

  pre_tasks:
    # Digest, não tag. Uma tag pode ser reapontada; o digest identifica bytes.
    - name: Exigir os digests aprovados pela pipeline
      ansible.builtin.assert:
        that:
          - backend_image is defined and backend_image | length > 0
          - frontend_image is defined and frontend_image | length > 0
          - edital_processor_image is defined and edital_processor_image | length > 0
        fail_msg: >-
          Faltam os digests das imagens. Este playbook só promove artefatos já
          publicados — rode a pipeline em vez de invocá-lo direto.

    - name: Recusar imagem identificada por tag mutável
      ansible.builtin.assert:
        that:
          - "'@sha256:' in backend_image"
          - "'@sha256:' in frontend_image"
          - "'@sha256:' in edital_processor_image"
        fail_msg: >-
          As imagens precisam vir por digest (repo@sha256:...). Uma tag como
          :latest não garante que o que sobe é o que foi testado.

    - name: Verificar conectividade antes de mudar qualquer coisa
      ansible.builtin.ping:

    - name: Verificar espaço em disco
      ansible.builtin.shell: df --output=avail -BM / | tail -1 | tr -dc '0-9'
      register: espaco_livre
      changed_when: false

    - name: Exigir espaço mínimo para o pull
      ansible.builtin.assert:
        that: espaco_livre.stdout | int > 2048
        fail_msg: "Menos de 2 GB livres em / — o pull das imagens pode falhar."

  tasks:
    # block/rescue: se QUALQUER passo abaixo falhar — incluindo o health check —
    # o rescue devolve a versão anterior. Sem isso um deploy que quebra no meio
    # deixa o ambiente no ar, quebrado, até alguém perceber.
    - name: Implantar a versão aprovada
      block:
        - name: Garantir o diretório da aplicação
          ansible.builtin.file:
            path: "{{ remote_app_dir }}"
            state: directory
            mode: '0750'

        # Guardado ANTES de sobrescrever o compose: é o que o rescue usa para
        # voltar, e é o que permite rollback sem rebuild.
        - name: Guardar o compose atual para rollback
          ansible.builtin.copy:
            src: "{{ remote_app_dir }}/docker-compose.yml"
            dest: "{{ previous_state_file }}"
            remote_src: true
            mode: '0640'
          failed_when: false
          register: backup_anterior

        - name: Autenticar no Container Registry
          ansible.builtin.shell:
            cmd: >-
              echo '{{ registry_password }}' |
              docker login -u '{{ registry_user }}' --password-stdin '{{ registry_host }}'
          no_log: true
          changed_when: false

        - name: Baixar as imagens aprovadas (por digest)
          community.docker.docker_image:
            name: "{{ item }}"
            source: pull
            force_source: false
          loop:
            - "{{ backend_image }}"
            - "{{ frontend_image }}"
            - "{{ edital_processor_image }}"

        - name: Instalar o compose desta versão
          ansible.builtin.template:
            src: "{{ playbook_dir }}/templates/docker-compose.prod.yml.j2"
            dest: "{{ remote_app_dir }}/docker-compose.yml"
            mode: '0640'

        - name: Subir/atualizar a stack
          ansible.builtin.command: docker compose up -d --remove-orphans
          args:
            chdir: "{{ remote_app_dir }}"
          register: compose_up
          changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

        # Dentro do block de propósito: se a aplicação não responder, isto falha
        # e dispara o rescue. Em post_tasks o rollback nunca aconteceria.
        - name: Exigir que a aplicação responda
          ansible.builtin.uri:
            url: "https://{{ app_domain }}/health"
            status_code: 200
          retries: 10
          delay: 5
          register: health
          until: health.status == 200
          delegate_to: localhost
          become: false

        - name: Confirmar a versão implantada
          ansible.builtin.debug:
            msg: >-
              OK - {{ backend_image }}
              (pipeline {{ deploy_pipeline_id | default('n/d') }})

      rescue:
        - name: Avisar que o deploy falhou
          ansible.builtin.debug:
            msg: >-
              FALHA no deploy de {{ app_domain }}. Restaurando a versão anterior.

        - name: Verificar se existe versão anterior
          ansible.builtin.stat:
            path: "{{ previous_state_file }}"
          register: anterior

        # Primeiro deploy do ambiente: não há para onde voltar. Derrubar a stack
        # é mais honesto que deixar meia versão de pé se passando por saudável.
        - name: Derrubar a stack incompleta (sem versão anterior)
          ansible.builtin.command: docker compose down
          args:
            chdir: "{{ remote_app_dir }}"
          when: not anterior.stat.exists
          failed_when: false

        - name: Restaurar o compose da versão anterior
          ansible.builtin.copy:
            src: "{{ previous_state_file }}"
            dest: "{{ remote_app_dir }}/docker-compose.yml"
            remote_src: true
            mode: '0640'
          when: anterior.stat.exists

        - name: Subir de volta a versão anterior
          ansible.builtin.command: docker compose up -d --remove-orphans
          args:
            chdir: "{{ remote_app_dir }}"
          when: anterior.stat.exists
          failed_when: false

        - name: Conferir se a versão anterior respondeu
          ansible.builtin.uri:
            url: "https://{{ app_domain }}/health"
            status_code: 200
          retries: 10
          delay: 5
          register: health_rollback
          until: health_rollback.status == 200
          when: anterior.stat.exists
          failed_when: false
          delegate_to: localhost
          become: false

        - name: Encerrar a sessão do Registry
          ansible.builtin.command: "docker logout {{ registry_host }}"
          changed_when: false
          failed_when: false

        # O job precisa terminar vermelho: um rollback bem-sucedido conserta o
        # ambiente, não a versão. Se o playbook saísse verde, a pipeline seguiria
        # para produção com um artefato que já falhou em homologação.
        - name: Falhar o deploy mesmo com o rollback feito
          ansible.builtin.fail:
            msg: >-
              Deploy revertido.
              {% if anterior.stat.exists %}
              A versão anterior está de pé{% if health_rollback.status | default(0) == 200 %} e respondendo{% else %} MAS NÃO RESPONDEU - verifique o servidor{% endif %}.
              {% else %}
              Não havia versão anterior; a stack foi derrubada.
              {% endif %}

    - name: Encerrar a sessão do Registry
      ansible.builtin.command: "docker logout {{ registry_host }}"
      changed_when: false
