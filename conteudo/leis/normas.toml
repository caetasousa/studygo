[[norma]]
slug = "lgpd"
nome = "Lei Geral de Proteção de Dados Pessoais — Lei nº 13.709/2018"
curto = "LGPD"
disciplina = "LEGTI"
prioridade = "A"
fonte = "planalto"
link = "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
reconhecer = ["13.709"]
# Recorte técnico do edital: definições (anonimização, pseudonimização),
# princípios (necessidade/minimização), dados anonimizados, pesquisa com
# pseudonimização, segurança e boas práticas (privacy by design).
recorte = ["art5-art6", "art12-art13", "art46-art51"]
questoes = true
# Revisadas em 25/09/2026: incisos da Lei 12.965 citados entre aspas pelo
# art. 60, que a altera — não são incisos da LGPD.
aceitar = [
  "p0649: a regra diz solto",
  "p0653: a regra diz solto",
]

