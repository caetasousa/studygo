# As normas que o edital do TCE-GO (Técnico de Controle Externo – TI, FCC)
# cobra nas disciplinas LEG (Legislação Institucional) e LEGTI (Legislação
# Aplicada à TI). É daqui que a captura lê o que baixar.
#
# Para uma norma sem link: preencha `link` e rode
#   make leis-capturar slug=<slug>
# `fonte` diz como ler o link:
#   planalto     → página do planalto.gov.br (HTML)
#   casacivil-go → id da lei na API da Casa Civil de Goiás (número no link
#                  legisla.casacivil.go.gov.br/pesquisa_legislacao/<id>/...)
#   link         → qualquer outra página HTML ou PDF
#
# `reconhecer` são os trechos que, achados no texto de um tópico do concurso,
# fazem o app sugerir esta norma para aquela matéria.
# `recorte` são as faixas de artigos que o edital cobra; é só delas que saem
# questões. Vazio = a norma inteira.
# `questoes = false` publica só a leitura (prioridades B e C, por enquanto).

[[norma]]
slug = "cf88"
nome = "Constituição da República Federativa do Brasil de 1988"
curto = "Constituição Federal"
disciplina = "LEG"
prioridade = "A"
fonte = "planalto"
link = "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"
reconhecer = ["Constituição da República Federativa do Brasil", "Constituição Federal"]
recorte = ["art37-art43", "art70-art75"]
questoes = true
# Revisada em 25/09/2026: a regra está certa — p0010 é o link do sumário do
# Planalto para o ADCT, não o ADCT.
aceitar = ["p0010: a regra diz descartar"]

