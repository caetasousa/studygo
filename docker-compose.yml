services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-annygo}:${POSTGRES_PASSWORD:-annygo}@postgres:5432/${POSTGRES_DB:-annygo}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-lite-latest}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-annygo}:${POSTGRES_PASSWORD:-annygo}@postgres:5432/${POSTGRES_DB:-annygo}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env}"
      LEMBRETE_INTERVALO: "${LEMBRETE_INTERVALO:-24h}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-annygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annygo}
      POSTGRES_DB: ${POSTGRES_DB:-annygo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annygo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
