services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-studygo}:${POSTGRES_PASSWORD:-studygo}@postgres:5432/${POSTGRES_DB:-studygo}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      EDITAL_PROCESSOR_URL: "${EDITAL_PROCESSOR_URL:-http://edital-processor:8000}"
      EDITAL_PROCESSOR_TOKEN: "${EDITAL_PROCESSOR_TOKEN:-dev-processor-token}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Internal-only: turns edital PDFs into a reviewable structured preview.
  # No host port — the backend reaches it over the compose network.
  edital-processor:
    build: ./edital-processor
    environment:
      EP_SERVICE_TOKEN: "${EDITAL_PROCESSOR_TOKEN:-dev-processor-token}"
      EP_GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - edital_work:/var/lib/edital-processor/work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: ./backend
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-studygo}:${POSTGRES_PASSWORD:-studygo}@postgres:5432/${POSTGRES_DB:-studygo}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env}"
      # Sem LEMBRETE_INTERVALO o worker roda na virada do dia. Aqui ele fica
      # curto de propósito: esperar a meia-noite para ver o worker agir
      # inviabiliza o desenvolvimento.
      LEMBRETE_INTERVALO: "${LEMBRETE_INTERVALO:-24h}"
      WORKER_TZ: "${WORKER_TZ:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studygo}
      POSTGRES_DB: ${POSTGRES_DB:-studygo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studygo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  edital_work:
